backend:
  name: github
  repo: YuriiHaiduk/kassel-digital-solution-yurii
  branch: main
  base_url: https://kassel-digital-solution-yurii.vercel.app/
  auth_endpoint: /api/auth

media_folder: "images"
public_folder: "/images"

locale: de

collections:
  # ============ ALLGEMEINE TEXTE ============
  - name: "settings"
    label: "Allgemeine Texte"
    files:
      - file: "site-data.json"
        label: "Website-Texte (DE / EN)"
        name: "site"
        fields:
          # --- HERO ---
          - { label: "DE | Hero — Überschrift", name: "hero_title_de", widget: "string" }
          - { label: "EN | Hero — title",        name: "hero_title_en", widget: "string" }
          - { label: "DE | Hero — Untertitel",   name: "hero_sub_de", widget: "text" }
          - { label: "EN | Hero — subtitle",     name: "hero_sub_en", widget: "text" }

          # --- ÜBER UNS ---
          - { label: "DE | Über uns — Überschrift", name: "about_title_de", widget: "string" }
          - { label: "EN | About — title",           name: "about_title_en", widget: "string" }
          - { label: "DE | Über uns — Text",         name: "about_text_de", widget: "text" }
          - { label: "EN | About — text",            name: "about_text_en", widget: "text" }

          # --- KONTAKT ---
          - { label: "Telefon", name: "phone",   widget: "string" }
          - { label: "E-Mail",  name: "email",   widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }

          # --- CTA-BANNER ---
          - { label: "DE | CTA — Überschrift", name: "cta_title_de", widget: "string" }
          - { label: "EN | CTA — title",        name: "cta_title_en", widget: "string" }
          - { label: "DE | CTA — Untertitel",   name: "cta_sub_de", widget: "text" }
          - { label: "EN | CTA — subtitle",     name: "cta_sub_en", widget: "text" }

          # --- PROZESS ---
          - label: "Prozess (4 Schritte)"
            name: "process"
            widget: "list"
            fields:
              - { label: "DE | Titel",       name: "title_de", widget: "string" }
              - { label: "EN | Title",        name: "title_en", widget: "string" }
              - { label: "DE | Beschreibung", name: "desc_de", widget: "text" }
              - { label: "EN | Description",  name: "desc_en", widget: "text" }

          # --- FAQ ---
          - label: "FAQ"
            name: "faq"
            widget: "list"
            fields:
              - { label: "DE | Frage",  name: "q_de", widget: "string" }
              - { label: "EN | Question", name: "q_en", widget: "string" }
              - { label: "DE | Antwort", name: "a_de", widget: "text" }
              - { label: "EN | Answer",  name: "a_en", widget: "text" }

  # ============ LEISTUNGEN ============
  - name: "services"
    label: "Leistungen"
    folder: "content/services"
    identifier_field: "title_de"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Icon (Emoji)", name: "icon", widget: "string", default: "✦" }
      - { label: "DE | Titel",        name: "title_de", widget: "string" }
      - { label: "URL проекта (ссылка)", name: "url", widget: "string", required: false }
      - { label: "EN | Title",         name: "title_en", widget: "string" }
      - { label: "DE | Beschreibung",  name: "desc_de", widget: "text" }
      - { label: "EN | Description",   name: "desc_en", widget: "text" }
      - { label: "Reihenfolge (Zahl)", name: "order", widget: "number", default: 0 }

  # ============ GALERIE ============
  - name: "gallery"
    label: "Galerie"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    identifier_field: "caption_de"
    fields:
      - { label: "Bild",              name: "image",      widget: "image" }
      - { label: "DE | Überschrift",  name: "caption_de", widget: "string" }
      - { label: "EN | Title",         name: "caption_en", widget: "string" }
      - { label: "DE | Beschreibung",  name: "desc_de",    widget: "text", required: false }
      - { label: "EN | Description",   name: "desc_en",    widget: "text", required: false }

  # ============ BEWERTUNGEN ============
  - name: "testimonials"
    label: "Bewertungen"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Kundenname",          name: "name",    widget: "string" }
      - { label: "Firma (optional)",     name: "company", widget: "string", required: false }
      - { label: "DE | Bewertungstext",  name: "text_de", widget: "text" }
      - { label: "EN | Review text",     name: "text_en", widget: "text" }
      - { label: "Foto (optional)",      name: "avatar",  widget: "image", required: false }